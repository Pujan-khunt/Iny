services:
  db:
    image: pgvector/pgvector:pg16
    container_name: inydb
    environment:
      POSTGRES_USER: iny
      POSTGRES_PASSWORD: iny
      POSTGRES_DB: inydb
    ports:
      - "5432:5432"
    volumes:
      - ./docker/enable_pgvector.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
